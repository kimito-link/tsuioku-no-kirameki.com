<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>追憶のきらめき コメビュ</title>
    <style>
      /* v0.1.652: 独自コメビュ「KIRAMEKI Comment View」。
         まず「飲みやすい=普段ずっと開ける読みやすさ」を最優先(弾幕/キャラ演出は後段)。
         切り離し可能な独立ウィンドウ。?obs=1 で透過背景=OBSウィンドウキャプチャ/ブラウザソース向け。 */
      :root {
        color-scheme: light dark;
        --cv-bg: #fbfdff;
        --cv-text: #1f2937;
        --cv-name: #0f6f9e;
        --cv-self: #b54708;
        --cv-sub: #6b7280;
        --cv-border: #e5edf5;
        --cv-row: #ffffff;
        --cv-accent: #0f8fd8;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --cv-bg: #0d1420;
          --cv-text: #eef2f7;
          --cv-name: #6cc4ff;
          --cv-self: #ffc177;
          --cv-sub: #9aa6b6;
          --cv-border: #233143;
          --cv-row: #131c2b;
        }
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        background: var(--cv-bg);
        color: var(--cv-text);
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Hiragino Sans',
          'Yu Gothic', sans-serif;
        font-size: 15px;
        line-height: 1.5;
        display: flex;
        flex-direction: column;
      }
      /* OBS 透過モード: 背景を消し、行カードだけ薄く残す(配信画面に重ねる) */
      body.is-obs {
        background: transparent;
      }
      body.is-obs .cv-toolbar { display: none; }
      body.is-obs .cv-row {
        background: rgb(0 0 0 / 38%);
        color: #fff;
        border-color: transparent;
        text-shadow: 0 1px 2px rgb(0 0 0 / 70%);
      }
      body.is-obs .cv-name { color: #8fd6ff; }

      .cv-toolbar {
        flex: 0 0 auto;
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
        padding: 8px 12px;
        border-bottom: 1px solid var(--cv-border);
        font-size: 12.5px;
        color: var(--cv-sub);
      }
      .cv-toolbar .cv-title {
        font-weight: 600;
        color: var(--cv-text);
        margin-right: 4px;
      }
      .cv-toolbar button {
        background: var(--cv-row);
        color: var(--cv-text);
        border: 1px solid var(--cv-border);
        border-radius: 8px;
        padding: 5px 12px;
        font-size: 12.5px;
        font-weight: 500;
        cursor: pointer;
      }
      .cv-toolbar button:hover { border-color: var(--cv-accent); }
      .cv-toolbar .cv-spacer { flex: 1 1 auto; }
      .cv-count { font-variant-numeric: tabular-nums; }

      .cv-list {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 8px 10px 14px;
        scroll-behavior: smooth;
        overscroll-behavior: contain;
      }
      /* 1コメント=1行(アイコン+名前+本文)。ゆったり余白で「飲みやすい」読みやすさ。 */
      .cv-row {
        display: flex;
        gap: 10px;
        align-items: flex-start;
        background: var(--cv-row);
        border: 1px solid var(--cv-border);
        border-radius: 12px;
        padding: 9px 12px;
        margin-bottom: 7px;
        animation: cvRowIn 260ms ease-out;
      }
      @media (prefers-reduced-motion: reduce) {
        .cv-row { animation: none; }
        .cv-list { scroll-behavior: auto; }
      }
      @keyframes cvRowIn {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .cv-avatar {
        flex: 0 0 auto;
        width: 30px;
        height: 30px;
        border-radius: 50%;
        object-fit: cover;
        background: color-mix(in srgb, var(--cv-accent) 18%, transparent);
      }
      .cv-avatar-fallback {
        flex: 0 0 auto;
        width: 30px;
        height: 30px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        font-size: 13px;
        font-weight: 600;
        color: #fff;
      }
      .cv-body { min-width: 0; flex: 1 1 auto; }
      .cv-name {
        font-size: 12.5px;
        font-weight: 600;
        color: var(--cv-name);
        margin-bottom: 1px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .cv-row.is-self .cv-name { color: var(--cv-self); }
      .cv-text {
        font-size: 15px;
        word-break: break-word;
        white-space: pre-wrap;
      }
      .cv-empty {
        color: var(--cv-sub);
        text-align: center;
        padding: 40px 16px;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <div class="cv-toolbar">
      <span class="cv-title">🌟 きらめきコメビュ</span>
      <span class="cv-meta" id="cvLiveMeta">—</span>
      <span class="cv-spacer"></span>
      <span class="cv-count" id="cvCount">0 件</span>
      <button id="cvBtnWindow" type="button" title="別ウィンドウで開く">⧉ 別窓</button>
      <button id="cvBtnObs" type="button" title="OBS用の透過表示に切替">OBS透過</button>
      <button id="cvBtnPause" type="button">一時停止</button>
    </div>
    <div class="cv-list" id="cvList">
      <div class="cv-empty" id="cvEmpty">コメントを待っています…</div>
    </div>
    <script src="dist/comeview.js"></script>
  </body>
</html>
