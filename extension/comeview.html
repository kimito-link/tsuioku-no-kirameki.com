<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>追憶のきらめき コメビュ</title>
    <style>
      /* v0.1.652: 独自コメビュ「KIRAMEKI Comment View」。
         まず「飲みやすい=普段ずっと開ける読みやすさ」を最優先(弾幕/キャラ演出は後段)。
         切り離し可能な独立ウィンドウ。?obs=1 で透過背景=OBSウィンドウキャプチャ/ブラウザソース向け。 */
      :root {
        color-scheme: light dark;
        --cv-bg: #fbfdff;
        --cv-text: #1f2937;
        --cv-name: #0f6f9e;
        --cv-self: #b54708;
        --cv-sub: #6b7280;
        --cv-border: #e5edf5;
        --cv-row: #ffffff;
        --cv-accent: #0f8fd8;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --cv-bg: #0d1420;
          --cv-text: #eef2f7;
          --cv-name: #6cc4ff;
          --cv-self: #ffc177;
          --cv-sub: #9aa6b6;
          --cv-border: #233143;
          --cv-row: #131c2b;
        }
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        background: var(--cv-bg);
        color: var(--cv-text);
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Hiragino Sans',
          'Yu Gothic', sans-serif;
        font-size: 15px;
        line-height: 1.5;
        display: flex;
        flex-direction: column;
      }
      /* OBS 透過モード: 背景を消し、行カードだけ薄く残す(配信画面に重ねる) */
      body.is-obs {
        background: transparent;
      }
      body.is-obs .cv-toolbar { display: none; }
      body.is-obs .cv-row {
        background: rgb(0 0 0 / 38%);
        color: #fff;
        border-color: transparent;
        text-shadow: 0 1px 2px rgb(0 0 0 / 70%);
      }
      body.is-obs .cv-name { color: #8fd6ff; }

      .cv-toolbar {
        flex: 0 0 auto;
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
        padding: 8px 12px;
        border-bottom: 1px solid var(--cv-border);
        font-size: 12.5px;
        color: var(--cv-sub);
      }
      .cv-toolbar .cv-title {
        font-weight: 600;
        color: var(--cv-text);
        margin-right: 4px;
      }
      .cv-toolbar button {
        background: var(--cv-row);
        color: var(--cv-text);
        border: 1px solid var(--cv-border);
        border-radius: 8px;
        padding: 5px 12px;
        font-size: 12.5px;
        font-weight: 500;
        cursor: pointer;
      }
      .cv-toolbar button:hover { border-color: var(--cv-accent); }
      .cv-toolbar button.is-on {
        color: #fff;
        background: var(--cv-accent);
        border-color: var(--cv-accent);
      }
      .cv-toolbar .cv-spacer { flex: 1 1 auto; }
      .cv-count { font-variant-numeric: tabular-nums; }
      .cv-voice-controls {
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .cv-voice-status {
        max-width: 220px;
        color: #b54708;
        line-height: 1.3;
      }
      .cv-voice-skip {
        color: var(--cv-sub);
        white-space: nowrap;
      }
      body.is-obs .cv-voice-controls { display: none !important; }

      .cv-list {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 8px 10px 14px;
        scroll-behavior: smooth;
        overscroll-behavior: contain;
      }
      /* 1コメント=1行(アイコン+名前+本文)。ゆったり余白で「飲みやすい」読みやすさ。 */
      .cv-row {
        display: flex;
        gap: 10px;
        align-items: flex-start;
        background: var(--cv-row);
        border: 1px solid var(--cv-border);
        border-radius: 12px;
        padding: 9px 12px;
        margin-bottom: 7px;
        animation: cvRowIn 260ms ease-out;
      }
      @media (prefers-reduced-motion: reduce) {
        .cv-row,
        .nl-tl-row.cv-row-in,
        .nl-tl-gift.cv-row-in { animation: none; }
        .cv-list { scroll-behavior: auto; }
      }
      @keyframes cvRowIn {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .cv-avatar {
        flex: 0 0 auto;
        width: 30px;
        height: 30px;
        border-radius: 50%;
        object-fit: cover;
        background: color-mix(in srgb, var(--cv-accent) 18%, transparent);
      }
      .cv-avatar-fallback {
        flex: 0 0 auto;
        width: 30px;
        height: 30px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        font-size: 13px;
        font-weight: 600;
        color: #fff;
      }
      .cv-body { min-width: 0; flex: 1 1 auto; }
      .cv-name {
        font-size: 12.5px;
        font-weight: 600;
        color: var(--cv-name);
        margin-bottom: 1px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .cv-row.is-self .cv-name { color: var(--cv-self); }
      .cv-text {
        font-size: 15px;
        word-break: break-word;
        white-space: pre-wrap;
      }
      .cv-empty {
        color: var(--cv-sub);
        text-align: center;
        padding: 40px 16px;
        font-size: 14px;
      }

      /* v0.1.677: 一覧外に1個だけ置いて使い回す、わんコメ式フローティング操作バー。 */
      .cv-hover-actions {
        position: fixed;
        z-index: 1200;
        display: none;
        gap: 0;
        background: var(--cv-row);
        border: 1px solid var(--cv-border);
        border-radius: 10px;
        padding: 3px;
        box-shadow: 0 3px 10px rgb(0 0 0 / 18%);
      }
      .cv-hover-actions.is-visible { display: flex; }
      .cv-hover-actions button {
        display: grid;
        place-items: center;
        width: 30px;
        height: 28px;
        background: none;
        border: none;
        border-radius: 7px;
        color: var(--cv-sub);
        cursor: pointer;
      }
      .cv-hover-actions button svg {
        width: 16px;
        height: 16px;
        fill: currentColor;
      }
      .cv-hover-actions button:hover {
        background: color-mix(in srgb, var(--cv-text) 10%, transparent);
        color: var(--cv-text);
      }
      .cv-hover-actions button:disabled {
        opacity: 0.28;
        cursor: default;
      }
      .cv-hover-actions button:disabled:hover {
        background: none;
        color: var(--cv-sub);
      }
      /* OBS 透過モードはオーバーレイ用途=操作 UI を出さない。 */
      body.is-obs .cv-hover-actions { display: none !important; }

      /* ピン留めバー(配信者が質問等を固定。OBS 透過窓にも同期表示)。 */
      .cv-pinbar {
        flex: 0 0 auto;
        display: flex;
        gap: 8px;
        align-items: flex-start;
        padding: 8px 12px;
        border-bottom: 1px solid var(--cv-border);
        background: color-mix(in srgb, var(--cv-accent) 8%, var(--cv-row));
        font-size: 14px;
      }
      .cv-pin-icon { flex: 0 0 auto; }
      .cv-pin-body { min-width: 0; flex: 1 1 auto; }
      .cv-pin-name {
        font-size: 12.5px;
        font-weight: 600;
        color: var(--cv-name);
        margin-right: 6px;
      }
      .cv-pin-text { word-break: break-word; white-space: pre-wrap; }
      .cv-pin-close {
        flex: 0 0 auto;
        background: none;
        border: none;
        color: var(--cv-sub);
        font-size: 13px;
        cursor: pointer;
        padding: 2px 4px;
      }
      body.is-obs .cv-pinbar {
        background: rgb(0 0 0 / 55%);
        color: #fff;
        border-color: transparent;
        border-radius: 10px;
        margin: 4px;
        text-shadow: 0 1px 2px rgb(0 0 0 / 70%);
      }
      body.is-obs .cv-pinbar .cv-pin-name { color: #8fd6ff; }
      body.is-obs .cv-pin-close { display: none; }

      /* 画面内パネル(この人の発言/NG 管理)。 */
      .cv-panel {
        position: absolute;
        inset: 44px 8px 8px;
        background: var(--cv-bg);
        border: 1px solid var(--cv-border);
        border-radius: 12px;
        box-shadow: 0 8px 28px rgb(0 0 0 / 22%);
        display: flex;
        flex-direction: column;
        z-index: 20;
      }
      .cv-panel-head {
        flex: 0 0 auto;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 9px 12px;
        border-bottom: 1px solid var(--cv-border);
        font-size: 13px;
        font-weight: 600;
      }
      .cv-panel-head .cv-spacer { flex: 1 1 auto; }
      .cv-panel-head button {
        background: var(--cv-row);
        color: var(--cv-text);
        border: 1px solid var(--cv-border);
        border-radius: 8px;
        padding: 3px 10px;
        font-size: 12.5px;
        cursor: pointer;
      }
      .cv-panel-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 8px 12px 12px;
      }
      .cv-panel-note {
        color: var(--cv-sub);
        font-size: 12.5px;
        margin: 4px 0 8px;
      }
      .cv-panel-row {
        display: flex;
        gap: 8px;
        align-items: baseline;
        padding: 5px 2px;
        border-bottom: 1px dashed var(--cv-border);
        font-size: 14px;
      }
      .cv-panel-no {
        flex: 0 0 auto;
        color: var(--cv-sub);
        font-size: 11.5px;
        font-variant-numeric: tabular-nums;
        min-width: 38px;
      }
      .cv-panel-text {
        min-width: 0;
        flex: 1 1 auto;
        word-break: break-word;
        white-space: pre-wrap;
      }
      .cv-panel-unng {
        flex: 0 0 auto;
        background: var(--cv-row);
        color: var(--cv-text);
        border: 1px solid var(--cv-border);
        border-radius: 8px;
        padding: 2px 10px;
        font-size: 12px;
        cursor: pointer;
      }
      body.is-obs .cv-panel { display: none !important; }

      /* v0.1.676: 一覧は POP(パネル)の応援タイムラインと同一描画。popup.html の
         .nl-tl-* スタイルを移植し、変数だけコメビュ側に橋渡しする(見た目も同じに)。 */
      :root {
        --nl-text: var(--cv-text);
        --nl-muted: var(--cv-sub);
        --nl-border: var(--cv-border);
        --nl-surface: var(--cv-row);
        --nl-accent: var(--cv-accent);
      }
      .cv-list { display: flex; flex-direction: column; gap: 2px; }
      .nl-support-timeline__empty {
        color: var(--cv-sub);
        text-align: center;
        padding: 40px 16px;
        font-size: 14px;
      }
      /* v0.1.681: わんコメ式の大型2行レイアウト(星野ロミ式=設定なしで読める既定値)。
         データ・行HTMLはPOPと同一のまま、コメビュだけ「読む道具」の見た目にする。
         1行目=名前+生ID(薄字)+時刻 / 2行目=本文を切らずに全文折り返し。 */
      .nl-tl-row {
        display: grid;
        grid-template-columns: auto auto 1fr auto;
        grid-template-areas:
          'avatar name uid time'
          'avatar text text text';
        column-gap: 12px;
        row-gap: 2px;
        min-width: 0;
        padding: 10px 12px;
        border-bottom: 1px solid var(--cv-border);
        font-size: 16px;
        line-height: 1.55;
        color: var(--nl-text);
        text-decoration: none;
      }
      .nl-tl-row.cv-row-in,
      .nl-tl-gift.cv-row-in {
        animation: cvRowIn 220ms ease-out;
      }
      /* 生ID(データ属性)を名前の横に薄字で出す=情報セット原則(わんコメと同型)。 */
      .nl-tl-row[data-nl-uid]::after {
        content: '(' attr(data-nl-uid) ')';
        grid-area: uid;
        align-self: center;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        color: var(--nl-muted);
        font-size: 11.5px;
        opacity: 0.75;
      }
      .nl-tl-row__avatar {
        grid-area: avatar;
        align-self: start;
        width: 36px;
        height: 36px;
        border-radius: 999px;
        object-fit: cover;
        background: #fff;
        border: 1px solid color-mix(in srgb, var(--nl-border) 60%, transparent);
      }
      .nl-tl-row__name {
        grid-area: name;
        min-width: 0;
        max-width: 16em;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-weight: 700;
        font-size: 13.5px;
        color: var(--cv-name);
      }
      .nl-tl-row__text {
        grid-area: text;
        min-width: 0;
        white-space: pre-wrap;
        word-break: break-word;
        overflow: visible;
        text-overflow: clip;
      }
      .nl-tl-row--self .nl-tl-row__name {
        color: var(--cv-self);
      }
      .nl-tl-gift {
        display: grid;
        grid-template-columns: auto auto 1fr auto;
        grid-template-areas:
          'avatar name pt time'
          'avatar item item item';
        column-gap: 12px;
        row-gap: 2px;
        min-width: 0;
        margin: 6px 4px;
        padding: 10px 12px;
        border-radius: 12px;
        font-size: 15px;
        line-height: 1.5;
        background: linear-gradient(
          90deg,
          color-mix(in srgb, #ffb020 16%, var(--nl-surface)),
          color-mix(in srgb, #ff7eb6 12%, var(--nl-surface))
        );
        border: 1px solid color-mix(in srgb, #ffb020 38%, var(--nl-border));
        text-decoration: none;
        color: var(--nl-text);
      }
      .nl-tl-gift__icon {
        grid-area: avatar;
        align-self: start;
        font-size: 24px;
      }
      .nl-tl-gift__avatar-wrap {
        grid-area: avatar;
        position: relative;
        align-self: start;
        width: 36px;
        height: 36px;
      }
      .nl-tl-gift__avatar {
        width: 36px;
        height: 36px;
        border-radius: 999px;
        object-fit: cover;
        background: #fff;
        border: 1px solid color-mix(in srgb, #ffb020 50%, var(--nl-border));
      }
      .nl-tl-gift__badge {
        position: absolute;
        right: -4px;
        bottom: -4px;
        font-size: 13px;
        line-height: 1;
        filter: drop-shadow(0 0 1px #fff) drop-shadow(0 0 1px #fff);
      }
      .nl-tl-gift__name {
        grid-area: name;
        min-width: 0;
        max-width: 16em;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-weight: 800;
        font-size: 13.5px;
      }
      .nl-tl-gift__item {
        grid-area: item;
        min-width: 0;
        white-space: pre-wrap;
        word-break: break-word;
        color: var(--nl-text);
      }
      .nl-tl-gift__pt {
        grid-area: pt;
        justify-self: end;
        font-weight: 800;
        color: #b06f00;
        font-variant-numeric: tabular-nums;
      }
      .nl-tl-time {
        grid-area: time;
        justify-self: end;
        align-self: center;
        font-size: 11px;
        font-weight: 600;
        color: var(--nl-muted);
        font-variant-numeric: tabular-nums;
      }
      #cvList [data-nl-uid] { cursor: pointer; }
      #cvList [data-nl-uid]:hover {
        background: color-mix(in srgb, var(--nl-accent, #0f8fd8) 8%, transparent);
      }
      /* OBS 透過: 行カードだけ読みやすく重ねる(大型2行レイアウトを継承)。 */
      body.is-obs .nl-tl-row,
      body.is-obs .nl-tl-gift {
        background: rgb(0 0 0 / 38%);
        color: #fff;
        border-color: transparent;
        text-shadow: 0 1px 2px rgb(0 0 0 / 70%);
        border-radius: 10px;
        margin: 4px;
      }
      body.is-obs .nl-tl-row__name { color: #8fd6ff; }
      body.is-obs .nl-tl-gift__pt { color: #ffd479; }
      /* OBS オーバーレイでは生ID・時刻は出さない(画面を汚さない・本文最優先)。 */
      body.is-obs .nl-tl-row[data-nl-uid]::after,
      body.is-obs .nl-tl-time { display: none; }

      /* v0.1.667: ユーザー詳細(わんコメ式 ニックネーム/ラベル/メモ)。 */
      .cv-name { display: flex; align-items: center; gap: 6px; min-width: 0; }
      .cv-name-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .cv-label-chip {
        flex: 0 0 auto;
        font-size: 10.5px;
        font-weight: 600;
        color: var(--cv-accent);
        background: color-mix(in srgb, var(--cv-accent) 12%, transparent);
        border: 1px solid color-mix(in srgb, var(--cv-accent) 35%, transparent);
        border-radius: 999px;
        padding: 1px 7px;
        white-space: nowrap;
      }
      body.is-obs .cv-label-chip {
        color: #8fd6ff;
        background: rgb(0 0 0 / 30%);
        border-color: rgb(143 214 255 / 50%);
      }
      /* 詳細ヘッダ: サムネ・名前・ID・リンクをセットで(わんコメ同型)。 */
      .cv-detail-head {
        display: flex;
        align-items: center;
        gap: 12px;
        margin: 2px 0 12px;
      }
      .cv-detail-avatar {
        flex: 0 0 auto;
        width: 44px;
        height: 44px;
        border-radius: 50%;
        object-fit: cover;
        font-size: 18px;
      }
      .cv-detail-head-body { min-width: 0; flex: 1 1 auto; }
      .cv-detail-name {
        font-size: 15px;
        font-weight: 700;
        margin-bottom: 2px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .cv-detail-id {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        font-size: 12.5px;
        color: var(--cv-sub);
        word-break: break-all;
      }
      .cv-ng-avatar {
        flex: 0 0 auto;
        width: 24px;
        height: 24px;
        border-radius: 50%;
        object-fit: cover;
      }
      .cv-detail-form {
        display: flex;
        flex-direction: column;
        gap: 10px;
        margin-bottom: 14px;
        padding-bottom: 12px;
        border-bottom: 1px solid var(--cv-border);
      }
      .cv-detail-field { display: flex; flex-direction: column; gap: 4px; }
      .cv-detail-field > span {
        font-size: 11.5px;
        color: var(--cv-sub);
      }
      .cv-detail-field input,
      .cv-detail-field textarea {
        background: var(--cv-row);
        color: var(--cv-text);
        border: 1px solid var(--cv-border);
        border-radius: 8px;
        padding: 7px 10px;
        font-size: 14px;
        font-family: inherit;
      }
      .cv-detail-field input:focus,
      .cv-detail-field textarea:focus {
        outline: none;
        border-color: var(--cv-accent);
      }
      .cv-detail-field textarea { min-height: 64px; resize: vertical; }
      .cv-panel-time {
        flex: 0 0 auto;
        color: var(--cv-sub);
        font-size: 11px;
        font-variant-numeric: tabular-nums;
      }
    </style>
  </head>
  <body>
    <div class="cv-toolbar">
      <span class="cv-title">🌟 きらめきコメビュ</span>
      <span class="cv-meta" id="cvLiveMeta">—</span>
      <span class="cv-spacer"></span>
      <span class="cv-count" id="cvCount">0 件</span>
      <span class="cv-voice-controls">
        <button id="cvBtnVoice" type="button" aria-pressed="false">🔊 読み上げ OFF</button>
        <button id="cvBtnVoiceName" type="button" aria-pressed="false" hidden>名前読み OFF</button>
        <span class="cv-voice-status" id="cvVoiceStatus" role="status"></span>
        <span class="cv-voice-skip" id="cvVoiceSkip" aria-live="polite"></span>
      </span>
      <button id="cvBtnNg" type="button" title="非表示にした人を管理" style="display: none;">NG 0</button>
      <button id="cvBtnWindow" type="button" title="別ウィンドウで開く">⧉ 別窓</button>
      <button id="cvBtnObs" type="button" title="OBS用の透過表示に切替">OBS透過</button>
      <button id="cvBtnPause" type="button">一時停止</button>
    </div>
    <div class="cv-pinbar" id="cvPinBar" style="display: none;"></div>
    <div class="cv-list" id="cvList">
      <div class="cv-empty" id="cvEmpty">コメントを待っています…</div>
    </div>
    <div class="cv-panel" id="cvPanel" style="display: none;">
      <div class="cv-panel-head">
        <span id="cvPanelTitle">—</span>
        <span class="cv-spacer"></span>
        <button id="cvPanelClose" type="button">閉じる</button>
      </div>
      <div class="cv-panel-body" id="cvPanelBody"></div>
    </div>
    <script src="dist/comeview.js"></script>
  </body>
</html>
