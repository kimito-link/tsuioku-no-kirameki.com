<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>応援ライブビュー — 君斗りんくの追憶のきらめき</title>
    <!--
      2026-06-23 応援ライブビュー「そっくりそのまま」(案B2・council/live-view-wholesale-clone-SYNTHESIS.md):
        独自骨格(配信ヘッダ/盛り上がり/応援者ランキンググリッド…)は popup と「はじめから別物」と実機で確認
        されたため【廃止】。本物の popup.html を iframe で全面に埋め込み、popup そっくりそのままを出す。
        popup.html?inline=1&dock=liveview&lv=<lv> = 受動ビュー(storage 書かない/watch 注入しない/外部 fetch
        しない)+ 全画面。lv は live-view-entry.js が ?lv= から焼く。status の ensureStatusPopupIframe と同型。
    -->
    <style>
      :root {
        color-scheme: light;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #f7fbff;
      }
      /* popup を全面に埋める iframe。border 無し・全画面。 */
      #lvPopupFrame {
        display: block;
        width: 100vw;
        height: 100vh;
        border: 0;
        background: transparent;
      }
      /* ?lv= が無い時の案内(死に画面にしない)。iframe が出る時は JS で hidden。 */
      #lvNoLive {
        max-width: 560px;
        margin: 12vh auto 0;
        padding: 24px 20px;
        font:
          14px/1.7 system-ui,
          "Segoe UI",
          sans-serif;
        color: #334155;
        text-align: center;
      }
      #lvNoLive h1 {
        font-size: 16px;
        margin: 0 0 8px;
      }
      #lvNoLive code {
        background: #e8f0fb;
        border-radius: 6px;
        padding: 1px 6px;
      }
    </style>
  </head>
  <body>
    <!-- 配信が指定された時だけ JS が src を焼いて表示する(初期は hidden=空 src で読み込まない)。 -->
    <iframe
      id="lvPopupFrame"
      title="応援ライブビュー(popup 埋め込み)"
      referrerpolicy="no-referrer"
      hidden
    ></iframe>

    <!-- ?lv= が無い時の案内。 -->
    <section id="lvNoLive">
      <h1>配信が指定されていません</h1>
      <p>
        このページは <code>?lv=lv××××××</code> を付けて開いてください。<br />
        通常は応援コメント記録パネルの「ちくらん」カードから開きます。
      </p>
    </section>

    <script src="dist/live-view.js"></script>
  </body>
</html>
