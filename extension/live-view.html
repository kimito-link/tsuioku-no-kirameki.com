<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>応援ライブビュー — 君斗りんくの追憶のきらめき</title>
    <style>
      /* v0.1.877: popup の正規変数(--nl-*・ライトが既定)をそのまま採用=完全コピー。アレンジを足さない。
         旧エイリアス(--bg 等)も --nl-* に向けて残し、既存 live-view CSS を壊さない。 */
      :root {
        --nl-bg: #fffaf2;
        --nl-bg-soft: #eef8ff;
        --nl-surface: #ffffff;
        --nl-text: #1f2937;
        --nl-text-sub: #4b5563;
        --nl-muted: #5b6475;
        --nl-border: #d5e3f5;
        --nl-accent: #0f8fd8;
        --nl-accent-hover: #0b73ad;
        --nl-rank-count: #0f766e;
        /* 旧エイリアス → popup 変数へ。 */
        --bg: var(--nl-bg);
        --bg-soft: var(--nl-bg-soft);
        --card: var(--nl-surface);
        --line: var(--nl-border);
        --text: var(--nl-text);
        --muted: var(--nl-muted);
        --accent: var(--nl-accent);
        --accent-hover: var(--nl-accent-hover);
        --hot: #f97316;
        --blaze: #ef4444;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        /* popup と同じグラデ背景(--nl-bg → --nl-bg-soft)。 */
        background: linear-gradient(180deg, var(--bg), var(--bg-soft));
        color: var(--text);
        font-family: system-ui, -apple-system, "Segoe UI", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
        line-height: 1.6;
      }
      .wrap { max-width: 760px; margin: 0 auto; padding: 18px 16px 60px; }
      header.lv-head {
        display: flex;
        gap: 14px;
        align-items: flex-start;
        margin-bottom: 16px;
      }
      .lv-thumb {
        flex: 0 0 auto;
        width: 160px;
        height: 90px;
        border-radius: 10px;
        overflow: hidden;
        background: var(--line);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .lv-thumb img { width: 100%; height: 100%; object-fit: cover; }
      .lv-title { font-size: 18px; font-weight: 700; }
      .lv-broadcaster { color: var(--muted); font-size: 14px; }
      .lv-meta { margin-top: 6px; font-size: 14px; color: var(--text); }
      .lv-meta span { margin-right: 12px; }

      /* 盛り上がりメーター(脈打つ) */
      .heat {
        margin: 14px 0 18px;
        padding: 14px 16px;
        border-radius: 12px;
        border: 1px solid var(--line);
        background: var(--card);
      }
      .heat-label { font-size: 14px; color: var(--muted); margin-bottom: 8px; }
      .heat-value { font-size: 30px; font-weight: 800; letter-spacing: 0.5px; }
      .heat-bar-track {
        margin-top: 10px;
        height: 14px;
        border-radius: 999px;
        background: #20262e;
        overflow: hidden;
      }
      .heat-bar-fill {
        height: 100%;
        width: 0%;
        border-radius: 999px;
        background: linear-gradient(90deg, var(--accent), var(--hot), var(--blaze));
        transition: width 0.6s ease;
      }
      .pulse { animation: pulse 1.2s ease-in-out infinite; }
      @keyframes pulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.04); }
      }

      section.panel {
        margin: 16px 0;
        padding: 14px 16px;
        border-radius: 12px;
        border: 1px solid var(--line);
        background: var(--card);
      }
      section.panel h2 { font-size: 15px; margin: 0 0 10px; }
      /* v0.1.877: popup の応援ランキング(.nl-top-support-rank__*)を【そのまま】コピー。アレンジ無し。
         popup-entry.js renderTopSupportRankStrip と同じHTML/クラスを live-view-entry.js が生成する。
         タイル状に並べるため __list を grid に(popup の userThumbGrid 相当の見た目)。 */
      .nl-top-support-rank__list {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(108px, 1fr));
        gap: 8px;
        list-style: none;
        margin: 0;
        padding: 0;
      }
      .nl-top-support-rank__line {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2px;
        padding: 12px 6px 8px;
        border-radius: 8px;
        border: 1px solid var(--nl-border);
        background: var(--nl-surface);
        text-decoration: none;
        color: var(--nl-text);
        min-width: 0;
      }
      a.nl-top-support-rank__line--linkable:hover {
        border-color: var(--nl-accent);
      }
      .nl-top-support-rank__place {
        position: absolute;
        top: 4px;
        left: 5px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 1.4em;
        height: 1.4em;
        padding: 0 0.3em;
        font-size: 11px;
        font-weight: 800;
        color: #fff;
        background: linear-gradient(145deg, #64748b, #475569);
        border-radius: 999px;
        line-height: 1;
      }
      .nl-top-support-rank__line--has-accent .nl-top-support-rank__place {
        background: var(--nl-rank-accent, var(--nl-accent));
      }
      .nl-top-support-rank__place--empty { visibility: hidden; }
      .nl-top-support-rank__thumb-wrap {
        width: 48px;
        height: 48px;
        border-radius: 50%;
        overflow: hidden;
        background: var(--nl-surface);
        border: 1px solid color-mix(in srgb, var(--nl-border) 78%, #fff 22%);
        flex-shrink: 0;
      }
      .nl-top-support-rank__thumb { width: 100%; height: 100%; object-fit: cover; display: block; }
      .nl-top-support-rank__count {
        font-weight: 800;
        font-variant-numeric: tabular-nums;
        font-size: 14px;
        color: var(--nl-rank-count, #0f766e);
      }
      .nl-top-support-rank__name {
        font-weight: 600;
        font-size: 12px;
        max-width: 100%;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        color: var(--nl-text);
      }
      .nl-top-support-rank__id {
        font-size: 10px;
        color: var(--nl-text-sub);
        max-width: 100%;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      /* 配信者タイル(popup と同じアクセント枠)。 */
      .nl-top-support-rank__caster {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 3px;
        padding: 12px 6px 8px;
        border-radius: 8px;
        border: 1px solid color-mix(in srgb, var(--nl-accent) 35%, var(--nl-border) 65%);
        background: color-mix(in srgb, var(--nl-accent) 10%, var(--nl-surface) 90%);
        text-decoration: none;
        color: var(--nl-text);
      }
      .nl-top-support-rank__caster-label {
        font-size: 10px;
        font-weight: 700;
        color: color-mix(in srgb, var(--nl-accent) 75%, var(--nl-text) 25%);
      }
      .nl-top-support-rank__caster-thumb {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        object-fit: cover;
        background: var(--nl-surface);
        border: 2px solid color-mix(in srgb, var(--nl-accent) 30%, transparent);
      }
      .nl-top-support-rank__caster-name {
        font-size: 12px;
        font-weight: 600;
        max-width: 100%;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .nl-top-support-rank__caster-follow {
        display: inline-flex;
        align-items: center;
        padding: 2px 12px;
        border-radius: 999px;
        font-size: 11px;
        color: #fff;
        background: var(--nl-accent);
        text-decoration: none;
      }
      /* v0.1.875: りんく列/ギフト列(popup のアイコン列を再現)。小さめアイコンを横に流す。 */
      .lane-note {
        font-size: 12px;
        color: var(--muted);
        margin: 0 0 10px;
        padding: 8px 10px;
        border-radius: 8px;
        background: color-mix(in srgb, var(--accent) 8%, transparent);
      }
      .lane-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(84px, 1fr));
        gap: 8px;
      }
      .lane-tile { text-align: center; min-width: 0; }
      .lane-av {
        width: 40px;
        height: 40px;
        margin: 0 auto 4px;
        border-radius: 50%;
        overflow: hidden;
        background: var(--line);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 18px;
      }
      .lane-av img { width: 100%; height: 100%; object-fit: cover; }
      .lane-name {
        font-size: 11px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .lane-uid {
        font-size: 10px;
        color: var(--muted);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .empty { color: var(--muted); }
      .updated { color: var(--muted); font-size: 12px; margin-top: 16px; }
      .live-dot {
        display: inline-block;
        width: 8px; height: 8px; border-radius: 50%;
        background: #22c55e; margin-right: 6px;
        animation: pulse 1.2s ease-in-out infinite;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header class="lv-head">
        <div class="lv-thumb" id="lvThumb"><span style="font-size:28px;opacity:.6">🎥</span></div>
        <div>
          <div class="lv-title" id="lvTitle">読み込み中…</div>
          <div class="lv-broadcaster" id="lvBroadcaster"></div>
          <div class="lv-meta" id="lvMeta"></div>
        </div>
      </header>

      <div class="heat" id="heatBox">
        <div class="heat-label">🔥 盛り上がり(コメントの勢い)</div>
        <div class="heat-value" id="heatValue">—</div>
        <div class="heat-bar-track"><div class="heat-bar-fill" id="heatFill"></div></div>
      </div>

      <section class="panel">
        <h2>🏆 応援者ランキング</h2>
        <div id="rankBody" class="empty">読み込み中…</div>
      </section>

      <!-- v0.1.875: popup の「りんく列」(数値ID+個人サムネが揃った応援だけ)。 -->
      <section class="panel" id="linkLaneSec" hidden>
        <h2>🔗 りんく列(数値ID+個人サムネ)</h2>
        <p class="lane-note">数値ユーザーID + 個人サムネが揃った応援だけ、この列に出ます。匿名(a:)はここには出さない設計です。</p>
        <div id="linkLaneBody" class="lane-grid"></div>
      </section>

      <!-- v0.1.875: popup の「ギフト列」(この放送でギフト/広告を投げた人)。 -->
      <section class="panel" id="giftLaneSec" hidden>
        <h2>🎁 ギフト列(ギフト/広告を投げた人)</h2>
        <p class="lane-note">この放送でギフトや広告を投げた人を、数値IDで記録できた順(最新が先)に並べます。</p>
        <div id="giftLaneBody" class="lane-grid"></div>
      </section>

      <div class="updated"><span class="live-dot"></span><span id="updatedAt">—</span></div>
    </div>
    <script src="dist/live-view.js"></script>
  </body>
</html>
