<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>応援ライブビュー — 君斗りんくの追憶のきらめき</title>
    <!--
      2026-06-23 応援ライブビュー「そっくりそのまま」(案B2・council/live-view-wholesale-clone-SYNTHESIS.md):
        独自骨格(配信ヘッダ/盛り上がり/応援者ランキンググリッド…)は popup と「はじめから別物」と実機で確認
        されたため【廃止】。本物の popup.html を iframe で全面に埋め込み、popup そっくりそのままを出す。
        popup.html?inline=1&dock=liveview&lv=<lv> = 受動ビュー(storage 書かない/watch 注入しない/外部 fetch
        しない)+ 全画面。lv は live-view-entry.js が ?lv= から焼く。status の ensureStatusPopupIframe と同型。
    -->
    <style>
      :root {
        color-scheme: light;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #f7fbff;
      }
      /* popup を全面に埋める iframe。border 無し・全画面。 */
      #lvPopupFrame {
        display: block;
        width: 100vw;
        height: 100vh;
        border: 0;
        background: transparent;
      }
      /* ?lv= が無い時の案内(死に画面にしない)。iframe が出る時は JS で hidden。 */
      #lvNoLive {
        max-width: 560px;
        margin: 12vh auto 0;
        padding: 24px 20px;
        font:
          14px/1.7 system-ui,
          "Segoe UI",
          sans-serif;
        color: #334155;
        text-align: center;
      }
      #lvNoLive h1 {
        font-size: 16px;
        margin: 0 0 8px;
      }
      #lvNoLive code {
        background: #e8f0fb;
        border-radius: 6px;
        padding: 1px 6px;
      }
      /* 「このURLをWEBでも公開する」オーバーレイ(iframe の上に重ねる固定バー)。 */
      #lvPublishBar {
        position: fixed;
        right: 12px;
        bottom: 12px;
        z-index: 2147483647;
        max-width: min(92vw, 520px);
        font:
          13px/1.6 system-ui,
          "Segoe UI",
          sans-serif;
      }
      #lvPublishBtn {
        padding: 9px 16px;
        border-radius: 8px;
        border: 1px solid #f06aa0;
        background: #f06aa0;
        color: #fff;
        font-size: 13px;
        font-weight: 700;
        cursor: pointer;
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.18);
      }
      #lvPublishBtn:disabled {
        opacity: 0.6;
        cursor: default;
      }
      #lvPublishResult {
        margin-top: 8px;
        padding: 10px 12px;
        border-radius: 8px;
        border: 1px solid #f0c0d4;
        background: #fffdf9;
        color: #4a3b34;
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.16);
      }
      #lvPublishResult .lv-pub-head {
        font-weight: 700;
        color: #d6457f;
        margin-bottom: 6px;
      }
      #lvPublishResult .lv-pub-url {
        margin: 4px 0 8px;
        padding: 8px 10px;
        border: 1px solid #f06aa0;
        border-radius: 6px;
        background: #fff;
        word-break: break-all;
        user-select: all;
        font-size: 12px;
      }
      #lvPublishResult .lv-pub-actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      #lvPublishResult button {
        padding: 5px 12px;
        border-radius: 6px;
        border: 1px solid #f06aa0;
        background: #fff;
        color: #d6457f;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
      }
      #lvPublishResult.is-error {
        border-color: #f0c0c0;
        background: #fff3f3;
        color: #9a2c2c;
      }
      /* v0.1.1015: 3画面パリティ・バッジ。iframe の上・画面上部中央に固定で重ねる(ぱっと見で分かる)。
         ①POP=②この画面=③WEB が同一か(✅/🟡保留/🔴不一致)を、コピーせず一発で見せる。初期は hidden。 */
      #lvParityBadge {
        position: fixed;
        top: 10px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 2147483647;
        max-width: min(94vw, 640px);
        padding: 8px 14px;
        border-radius: 10px;
        border: 1px solid #d8d8e4;
        background: #fbfbfe;
        color: #2a2a33;
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.18);
        font:
          13px/1.5 system-ui,
          "Segoe UI",
          sans-serif;
      }
      #lvParityBadge .lv-parity-title {
        font-weight: 700;
        display: flex;
        align-items: baseline;
        gap: 6px;
      }
      #lvParityBadge .lv-parity-reason {
        margin-top: 2px;
        opacity: 0.85;
      }
      #lvParityBadge .lv-parity-next {
        margin-top: 3px;
        font-weight: 600;
      }
      #lvParityBadge.is-ok {
        border-color: #b7e0c2;
        background: #f0fbf3;
        color: #1f6b39;
      }
      #lvParityBadge.is-pending {
        border-color: #f0dca0;
        background: #fffbef;
        color: #8a6a1a;
      }
      #lvParityBadge.is-mismatch {
        border-color: #f0b8b8;
        background: #fff3f3;
        color: #9a2c2c;
      }
      /* 状態速報(①POP と同一本文)の折りたたみパネル。iframe の上に重ねる固定オーバーレイ(左下)。 */
      #lvStatusReport {
        position: fixed;
        left: 12px;
        bottom: 12px;
        z-index: 2147483646;
        max-width: min(92vw, 560px);
        border-radius: 8px;
        background: #fbfbfe;
        color: #2a2a33;
        border: 1px solid #d8d8e4;
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.16);
        overflow: hidden;
        font:
          12px/1.6 system-ui,
          "Segoe UI",
          sans-serif;
      }
      #lvStatusReport > summary {
        cursor: pointer;
        padding: 8px 12px;
        font-weight: 600;
        color: #3a3a55;
        user-select: none;
        list-style: none;
      }
      #lvStatusReportText {
        margin: 0;
        padding: 10px 12px;
        max-height: 50vh;
        overflow: auto;
        white-space: pre-wrap;
        word-break: break-word;
        border-top: 1px solid #e6e6ef;
        background: #fff;
        font:
          12px/1.55 ui-monospace,
          SFMono-Regular,
          Menlo,
          monospace;
      }
    </style>
  </head>
  <body>
    <!--
      2026-06-25: 「このURLをWEBでも公開する」導線。
        ユーザー導線=status で「応援ライブビューを開く」→このページが普通に開く→
        この画面(いま見ているもの)を、その次に WEB で公開できるようにする。
        公開ペイロードは status が KEY_LIVEVIEW_PUBLISH_PAYLOAD に置いたものを読んで POST するだけ
        (live-view 側で再構築しない=status が送るものと byte 一致)。
        iframe の上に重ねる固定オーバーレイ。押すまで何もしない(受動ビューのまま)。
    -->
    <div id="lvPublishBar">
      <button id="lvPublishBtn" type="button">🌐 このURLをWEBでも公開する</button>
      <div id="lvPublishResult" hidden></div>
    </div>

    <!--
      v0.1.1015: 3画面パリティ・バッジ(画面上部中央)。①POP=②この画面=③WEB が同一かを、状態速報を
        開かなくても一発で見せる。status が jsonBlob.parityVerdict に置いた構造化結果を読んで色付きで描く
        (再判定しない=①とバイト一致)。材料が無いうちは hidden。
    -->
    <div id="lvParityBadge" hidden></div>

    <!--
      2026-06-29(HANDOFF-resume-0629 §3 (A)): ①POP と【全く同じフル状態速報】を②応援ライブビューでも出す。
        status が KEY_LIVEVIEW_PUBLISH_PAYLOAD の jsonBlob.statusReport に置いた①の本文を読んで貼るだけ
        (再構築しない=①とバイト一致)。storage.onChanged で status の再描画に追従する。初期は hidden。
    -->
    <details id="lvStatusReport" hidden>
      <summary>🩺 状態速報(診断)を開く</summary>
      <pre id="lvStatusReportText"></pre>
    </details>

    <!-- 配信が指定された時だけ JS が src を焼いて表示する(初期は hidden=空 src で読み込まない)。 -->
    <iframe
      id="lvPopupFrame"
      title="応援ライブビュー(popup 埋め込み)"
      referrerpolicy="no-referrer"
      hidden
    ></iframe>

    <!-- ?lv= が無い時の案内。 -->
    <section id="lvNoLive">
      <h1>配信が指定されていません</h1>
      <p>
        このページは <code>?lv=lv××××××</code> を付けて開いてください。<br />
        通常は応援コメント記録パネルの「ちくらん」カードから開きます。
      </p>
    </section>

    <script src="dist/live-view.js"></script>
  </body>
</html>
