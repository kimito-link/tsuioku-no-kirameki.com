<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>君斗りんくの追憶のきらめき — サイドパネル</title>
    <style>
      /*
       * ★v0.1.1279: シェル(このファイル)に背景を持たせる。
       *   旧実装は背景も color-scheme も未指定だったため、iframe(popup.html)の描画が
       *   始まる前と、iframe が埋めない余白が【真っ黒】に抜けていた(ユーザー報告・実機)。
       *   popup.html は `color-scheme: light dark` を宣言しており OS 追従で暗くなるが、
       *   シェルはその宣言を持たないので「黒」ではなく「色が無い」状態だった。
       *   → popup.html と同じ既定色(--nl-bg / --nl-bg-soft)をシェルにも置いて揃える。
       */
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        /* iframe 内(popup.html)と同じ配色方針。フォームや scrollbar も OS 追従にする。 */
        color-scheme: light dark;
        /* popup.html の :root と同値(ライト既定)。 */
        background: linear-gradient(160deg, #fffaf2, #eef8ff);
      }
      @media (prefers-color-scheme: dark) {
        html,
        body {
          /* popup.html のダーク既定と同値。真っ黒(#000)にはしない。 */
          background: linear-gradient(160deg, #0b1220, #111827);
        }
      }
      iframe {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
        /* 読み込み中も背景が透けて黒くならないよう、iframe 自身にも同じ既定を敷く。 */
        background: transparent;
      }
    </style>
  </head>
  <body>
    <iframe title="ニコ生ログ" src="popup.html?inline=1&amp;dock=sidepanel"></iframe>
  </body>
</html>
