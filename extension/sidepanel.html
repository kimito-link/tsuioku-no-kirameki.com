<!DOCTYPE html><html lang="ja" style="color-scheme: light; background-color: #fffaf2; background-image: linear-gradient(160deg, #fffaf2, #eef8ff)">
<!--
  ★v0.1.1423: 導入時(795c41b3・25行)の姿へ戻した。

  ■ なぜ戻すか(ユーザーの証言・2026-08-17)
    「サイドパネル導入時は問題なかった」「前に進んでる気がしない」
    git log で裏付け: 導入時の sidepanel.html は 25行・幕なしで、黒くなかった。
    v0.1.1279 で幕(cloak)を足した版から黒が始まり、以後12版・200行まで
    「黒を消す工夫」を積み上げたが、実機の黒は一度も消えなかった。
    ＝足すのをやめ、始まりへ戻す。

  ■ ただし【色の宣言だけは残す】(消してはいけないもの)
    `color-scheme: light` と地の色は、OSがダークのときChromeが
    キャンバスを暗色で塗るのを止める唯一の手段(v0.1.1289/1294/1316/1369)。
    これは「中身を隠す」幕とは別物で、隠さずに色だけ決める。
    ★検査 pageColorSchemeGate / colorSchemeMetaPresent /
      sidepanelBlackScreen が機械照合する(消すと赤くなる=実際に赤で気づいた)。
    ★値は popup.html の1行目と同値。変えるときは両方。
-->
  <head>
    <meta charset="utf-8" />
    <!-- パース初期にブラウザへ伝える層(インライン style は CSS 適用後に効くため二段構え)。 -->
    <meta name="color-scheme" content="light" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>君斗りんくの追憶のきらめき — サイドパネル</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        color-scheme: light;
        background-color: #fffaf2; background-image: linear-gradient(160deg, #fffaf2, #eef8ff);
      }
      /*
        ★v0.1.1457: body を【位置指定の基準】にする。

        ■ ユーザー報告(複数回・一次情報)
          「くろいのがきえない」「引っ張った瞬間」
          ★「サイドパネル導入時はなかった」

        ■ 真因(コードで特定)
          `#nl-underlay` は `position: absolute; inset: 0` だが、
          **位置指定された祖先が1つも無かった**(html も body も static)。
          → 基準が【初期包含ブロック】になり、
          ★パネルを引っ張って広げた瞬間、下敷きが**新しく現れた帯に届かない**。
          そこだけ地の色が無く、黒く見える。

        ★`position: relative` を1つ足すだけで下敷きが body に追従する。
          relative は自分自身をずらさないので**見た目は1ピクセルも変わらない**。
        ★これは「幕」でも「隠す」でもない = 中身を覆う事故が起きない。
      */
      body {
        position: relative;
      }
      /*
        ★v0.1.1457: body を【位置指定の基準】にする。

        ■ これは正しい修正だが【引っ張った瞬間の黒の真因ではなかった】
          ★2026-08-21 訂正: 私は「下敷きが幅変更に追従しないのが真因」と断定して
          この版を出したが、ユーザー実機では**黒は消えなかった**。
          その後スクショで判明した実際の正体は
          **液晶保護アプリ(DISPLAY-002)の焼き付き防止オーバーレイ**で、
          拡張と無関係の X(Twitter)のタブまで同じ縞模様に覆われていた。
          ＝**拡張のせいではない**。[[measure-the-region-you-claim-2026-08-10]]

        ■ ではなぜこの1行を残すのか(害が無く、筋は通っているため)
          `#nl-underlay` は `position: absolute; inset: 0` なのに、
          **位置指定された祖先が1つも無かった**(html も body も static)。
          基準が初期包含ブロックになるのは事実で、body を基準にするのが正しい。
        ★relative は自身をずらさないので**見た目は1ピクセルも変わらない**。
        ★ただし「これで黒が直る」とは書かない(実機で直っていない)。
      */
      body {
        position: relative;
      }
      iframe {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
        /* iframe 自身も不透明で塗る(最後の砦)。#fffaf2 は popup.html の --nl-bg と同値。 */
        /*
          iframe 自身も不透明で塗る(最後の砎)。#fffaf2 は popup.html の --nl-bg と同値。

          ★v0.1.1440 でここを transparent にしかけてやめた(記録として残す)。
            世界調査は「リサイズ中の未描画帯で下敷きを透かせるため透明にせよ」と推奨したが、
            ★その主張は【実測で裏取れていない】と調査自身が明記していた。
            一方このリポには v0.1.1279〜1283 で【透明にしたことが真っ黒の原因だった】
            という実体験があり、sidepanelBlackScreen.wiring.test.js が禁止として
            機械照合している。★実測済の過去の失敗 > 未検証の推論。だから不透明のまま。
        */
        background: #fffaf2;
        /* src 読込前の about:blank 文書へ color-scheme を継承させる(v0.1.1369)。 */
        color-scheme: light;
        /* ★v0.1.1438: 下敷きより上に置く(中身が下敷きに隠れないように)。 */
        position: relative;
        z-index: 1;
      }
      /*
        ★v0.1.1436: 【出来上がるまで iframe を画面から外す】。

        黒が出るのは iframe が initial about:blank の間で、
        その文書は色スキームを持たないので UA が不透明なキャンバス
        (ダークなら黒)を敷く。★CSSWG 自身が「作者には制御できない」と
        認定しているので、色を宣言する方向では消せない(12版・200行の実績)。
        → その間だけ画面から外し、中身が出来たら見せる。

        ★このクラスを付けるのは JS(sidepanel-entry.js)だけ。
          HTML で初期非表示にしないのは、JS が動かないと
          【永久に真っ白】になるから(黒より悪い退化)。
      */
      /*
        ★v0.1.1561: 【iframe は隠さない】。上に親側の覆い(#nl-ifr-cover)を置き、中身が描かれたら外す。

        ■ なぜ opacity:0 で隠すのをやめたか(2026-10-05 実測・devtools Chrome)
          opacity:0 の iframe は Chrome が【描画を後回しにする】。中の文書の first-paint は
          見せた(opacity:1)【後】に初めて起きる(実測: 見せた 27〜50ms 後・= 2〜3 フレーム)。
          その 2〜3 フレームは iframe が見えているのに中身が無く、直前の about:blank の
          暗いフレームが残る＝「押した瞬間の黒」。2026-08-19 に「仕様由来の 32ms」と
          受け入れたものの正体はこれ(about:blank のキャンバスではなく、隠し方が描画を止めていた)。
          ★load を待っても描画を待っても、opacity:0 のままでは原理的に消えない。

        ■ 覆いにすると消える理由(同日実測)
          iframe を opacity:1 のまま、上に不透明な覆いを置くと、中の文書は覆われていても
          描画される(first-paint が load より【前】に来た: 123ms < 146ms)。
          覆いを外した瞬間には中身が既にある＝黒い隙間はゼロ。

        ■ これは 2026-08 に空振りした「幕(cloak)」とは違う点
          - 覆いは【親 sidepanel.html 側】にある。中の popup の JS が止まっていても外せる。
          - 外す合図は【中の文書の first-paint】(sidepanel-entry.js)。load では外さない。
          - 外す JS が死んでも CSS アニメーション(1.5s)で必ず外れる(下の保険)。
          - 覆った事実は自己診断(reveal: reason/loadAt/paintAt/revealAt)に必ず載る。
      */
      iframe.nl-ifr-loading {
        /* ★opacity は触らない(0 にすると中身の描画が止まる)。クラスは覆いの表示に使うだけ。 */
      }
      #nl-ifr-cover {
        position: absolute;
        inset: 0;
        /* iframe(z-index:1) より上。中身は隠れるが、描画は止まらない。 */
        z-index: 2;
        background-color: #fffaf2;
        background-image: linear-gradient(160deg, #fffaf2, #eef8ff);
        pointer-events: none;
        /* 既定は【無い】状態。JS が iframe に nl-ifr-loading を付けている間だけ現れる。 */
        opacity: 0;
        visibility: hidden;
      }
      iframe.nl-ifr-loading + #nl-ifr-cover {
        opacity: 1;
        visibility: visible;
        /*
          ★JS に依存しない保険。中身の描画で外す JS が動かなくても、1.5 秒で必ず外れる。
            (親と iframe は同じスレッドなので、JS が止まっている間は中身も描かれない。
             その間は覆い=クリーム色が見えるだけで、黒にはならない)
        */
        animation: nl-ifr-reveal 1.5s step-end forwards;
      }
      @keyframes nl-ifr-reveal {
        to { opacity: 0; visibility: hidden; }
      }
      /*
        ★v0.1.1438: 【下敷き】。iframe の下に地の色を敷きっぱなしにする。

        ■ これは【幕(cloak)ではない】——混同すると12版の失敗を繰り返す
          [[cloakNotForSidePanel]] が禁じたのは【中身を隠す幕】。
          解除が遅れて t+917ms まで隠れ、それが黒に見えていた。
          これは逆向き:
            ・中身を隠さない(iframe より【下】に敷くだけ)
            ・★JS で解除しない(解除自体が不要) = 解除漏れ事故が原理的に起きない

        ■ なぜ要るか
          v0.1.1437 で iframe を opacity:0 にして CSS アニメで開くようにしたが、
          ★メインスレッドが固まっている【間】はアニメも進まない(実測済)。
          その間 iframe は透明なので、下に何も無ければ
          UA の既定色(ダークなら黒)が見える。
          → 下に地の色を敷いておけば【黒の代わりにクリーム色】が見える。

        ■ ★JS を 1行も使わない
          真因が「JS が動けない時間帯」なのだから、対策を JS に置いてはいけない
          [[js-rescue-cannot-run-when-loop-stalls-2026-08-18]]。
      */
      #nl-underlay {
        /*
          ★v0.1.1440: fixed ではなく absolute。
          fixed はそれ自体が別の合成レイヤになり、
          リサイズ時に【そのレイヤも再描画待ち】になりうる。
          absolute なら親の塗りに乗るので、新しく現れた帯に届きやすい。
        */
        position: absolute;
        inset: 0;
        background-color: #fffaf2;
        /* ★中身の下に潜る。重ならないので「隠す」事故が起きない。 */
        z-index: 0;
        pointer-events: none;
      }

    </style>
  </head>
  <body>
    <!--
      ★下敷きは iframe より【先】に置く。
      iframe の読み込みが始まる前に地の色が塗られるようにするため。
      ★中身は隠さない(z-index で iframe の下に潜るだけ)。
    -->
    <div id="nl-underlay"></div>
    <iframe title="ニコ生ログ" src="popup.html?inline=1&amp;dock=sidepanel"></iframe>
    <!-- ★v0.1.1561: iframe の上に置く覆い。iframe が nl-ifr-loading の間だけ CSS で現れる(JS では作らない)。 -->
    <div id="nl-ifr-cover" aria-hidden="true"></div>
    <!--
      自己診断だけ残す(描画には一切関与しない)。
      これが無いと「いま黒いか」を測る手段が消え、また推測に戻ってしまう。
      CSP は script-src 'self' なので外部ファイルであること(インライン不可)。
    -->
    <script src="dist/sidepanel.js"></script>
  </body>
</html>
