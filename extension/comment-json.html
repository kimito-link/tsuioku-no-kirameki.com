<!DOCTYPE html><html lang="ja" style="color-scheme: light; background: #f8fafc">
  <head>
    <meta name="color-scheme" content="light" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>手元のコメントJSON</title>
    <style>
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Hiragino Sans', 'Yu Gothic', sans-serif;
        line-height: 1.5;
        background: #f8fafc;
        color: #0f172a;
      }
      main { max-width: 800px; margin: 0 auto; padding: 16px; }
      h1 { font-size: 1.25rem; margin: 0 0 8px; }
      p { margin: 0 0 12px; }
      .row { display: flex; flex-wrap: wrap; gap: 8px; }
      button {
        font: inherit;
        border-radius: 8px;
        border: 1px solid #64748b;
        padding: 8px 12px;
        background: #fff;
        color: #0f172a;
        cursor: pointer;
      }
      pre {
        margin: 0;
        padding: 12px;
        overflow: auto;
        max-height: 60vh;
        white-space: pre-wrap;
        word-break: break-word;
        background: #0f172a;
        color: #f8fafc;
        border-radius: 8px;
        font-size: 13px;
      }
      #status { min-height: 1.5em; font-weight: 700; }
    </style>
  </head>
  <body>
    <main>
      <h1>手元のコメントJSON</h1>
      <p>直近のコメントを、このPCの中だけで見ます。外部のサービスへは送りません。画像もランキングも入れません。</p>
      <p>拡張は待受の口を開けません。わんコメの localhost のAPIは、デスクトップアプリの機能です。外部ツールは、保存したJSONか、この画面を開いているあいだのファイル更新だけ使えます。拡張のアドレスは、OBSのブラウザソースからは開けません。</p>
      <p class="row">
        <button id="copyJson" type="button">コピー</button>
        <button id="downloadJson" type="button">ファイルに保存</button>
        <button id="watchFile" type="button">開いているあいだ同じファイルを更新</button>
      </p>
      <p id="status" role="status"></p>
      <pre id="json">{
  "comments": []
}</pre>
    </main>
    <script src="dist/comment-json.js"></script>
  </body>
</html>
