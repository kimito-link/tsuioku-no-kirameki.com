<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>歌枠の曲順</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Hiragino Sans', 'Yu Gothic', sans-serif;
        line-height: 1.5;
        background: #f8fafc;
        color: #0f172a;
      }
      main { max-width: 720px; margin: 0 auto; padding: 16px; }
      h1 { font-size: 1.25rem; margin: 0 0 8px; }
      p { margin: 0 0 12px; }
      section { margin: 0 0 16px; }
      .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
      button, input, textarea {
        font: inherit;
        border-radius: 8px;
        border: 1px solid #64748b;
      }
      button { padding: 8px 12px; background: #fff; color: #0f172a; cursor: pointer; }
      input, textarea { width: 100%; box-sizing: border-box; padding: 8px; background: #fff; color: #0f172a; }
      textarea { min-height: 72px; }
      li { margin: 0 0 8px; }
      li button { margin-left: 6px; }
      pre {
        margin: 0;
        padding: 12px;
        white-space: pre-wrap;
        background: #0f172a;
        color: #f8fafc;
        border-radius: 8px;
      }
      a { color: #0f4c81; }
      @media (prefers-color-scheme: dark) {
        body { background: #0f172a; color: #e2e8f0; }
        button, input, textarea { background: #1e293b; color: #e2e8f0; border-color: #94a3b8; }
        a { color: #93c5fd; }
      }
      @media (max-width: 640px) {
        li button { margin: 6px 6px 0 0; }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>歌枠の曲順</h1>
      <p>リクエストの言葉を先頭に付けたコメントだけを拾います。この画面を開いているあいだだけ見ます。配信ページの処理は増やしません。</p>
      <section>
        <h2>リクエストの言葉</h2>
        <p>1行に1つ。例は「リク」です。空のあいだは拾いません。</p>
        <textarea id="requestWords" aria-label="リクエストの言葉"></textarea>
        <p class="row"><button id="saveWords" type="button">言葉を保存</button></p>
      </section>
      <section>
        <h2>曲を足す</h2>
        <div class="row">
          <input id="songTitle" type="text" maxlength="80" aria-label="曲名" />
          <button id="addSong" type="button">曲順に足す</button>
          <button id="nextSong" type="button">次の曲へ</button>
        </div>
        <ol id="order"></ol>
      </section>
      <section>
        <h2>リクエスト</h2>
        <ul id="requests"></ul>
      </section>
      <section>
        <h2>配信用の文字</h2>
        <p>OBS のブラウザソースからは拡張の画面を開けません。下の文字だけの画面をウィンドウキャプチャしてください。動きや効果はありません。</p>
        <p class="row"><button id="openObs" type="button">文字だけの画面を開く</button></p>
        <pre id="obsText"></pre>
      </section>
    </main>
    <script src="dist/setlist.js"></script>
  </body>
</html>
