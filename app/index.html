<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>君斗りんく 状態(スマホ閲覧)</title>
    <style>
      /* 配色の正本は リポジトリ直下 DESIGN.md(Tsuioku Warm Pastel)。status.html と同じトークン。
         明るい暖色パステル(クリーム地・焦げ茶文字・桜ピンク)。常に明るく出す(OSダークでも暗転しない)。 */
      :root {
        color-scheme: light;
        --nl-bg: #fff7ec;          /* DESIGN.md colors.bg */
        --nl-text: #4a3b34;        /* colors.text(暖かい焦げ茶) */
        --nl-text-soft: #8a7568;   /* colors.textSoft */
        --nl-border: #e3c9b5;      /* colors.border(地に溶けない濃さ) */
        --nl-card-bg: #fffdf9;     /* colors.cardBg(純白を避ける) */
        --nl-accent: #f06aa0;      /* colors.accent(桜ピンク) */
        --nl-mono: ui-monospace, 'SFMono-Regular', 'Menlo', 'Consolas', monospace;
      }
      /* OS がダークでも明るいクリームのまま(light と同値で上書きを無効化)。 */
      @media (prefers-color-scheme: dark) {
        :root {
          --nl-bg: #fff7ec;
          --nl-text: #4a3b34;
          --nl-text-soft: #8a7568;
          --nl-border: #e3c9b5;
          --nl-card-bg: #fffdf9;
          --nl-accent: #f06aa0;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        background: var(--nl-bg);
        color: var(--nl-text);
        font-family:
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          'Hiragino Sans',
          'Yu Gothic',
          sans-serif;
        margin: 0;
        padding: 14px;
        max-width: 48ch;
        margin-inline: auto;
        line-height: 1.5;
      }
      header.status-header {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: baseline;
        border-bottom: 1px solid var(--nl-border);
        padding-bottom: 10px;
        margin-bottom: 14px;
      }
      header.status-header h1 {
        margin: 0;
        font-size: 17px;
      }
      .status-meta {
        color: var(--nl-text-soft);
        font-size: 13px;
        font-family: var(--nl-mono);
      }
      section.lane {
        background: var(--nl-card-bg);
        border: 1px solid var(--nl-border);
        border-radius: 12px;                              /* DESIGN.md rounded.md */
        padding: 12px 14px;
        margin-bottom: 12px;
        box-shadow: 0 1px 6px rgba(120, 80, 50, 0.08);    /* elevation.card ── 暖色の影 */
      }
      section.lane h2 {
        margin: 0 0 8px;
        font-size: 14px;
        font-weight: 600;
      }
      section.lane pre {
        margin: 0;
        font-family: var(--nl-mono);
        font-size: 12.5px;
        white-space: pre-wrap;
        word-break: break-word;
      }
      .live-block {
        margin-bottom: 12px;
      }
      footer.status-footer {
        margin-top: 18px;
        padding-top: 10px;
        border-top: 1px solid var(--nl-border);
        font-size: 12px;
        color: var(--nl-text-soft);
        font-family: var(--nl-mono);
      }
      .empty-note {
        color: var(--nl-text-soft);
        font-size: 13px;
        padding: 12px 0;
      }
      /* 共有診断 → 応援ライブビュー(ちくらん)への導線。上部に目立つボタン風リンク。 */
      .live-view-link {
        display: block;
        margin: 0 0 14px;
        padding: 11px 14px;
        border-radius: 10px;
        background: color-mix(in srgb, var(--nl-accent) 14%, var(--nl-card-bg));
        border: 1px solid color-mix(in srgb, var(--nl-accent) 45%, transparent);
        color: var(--nl-accent);
        font-size: 14px;
        font-weight: 700;
        text-align: center;
        text-decoration: none;
      }
      .live-view-link:hover {
        background: color-mix(in srgb, var(--nl-accent) 22%, var(--nl-card-bg));
      }
    </style>
  </head>
  <body>
    <header class="status-header">
      <h1>君斗りんく 状態</h1>
      <span class="status-meta" id="metaLastUpdate">最終更新 —</span>
    </header>

    <!-- 共有診断(この状態速報)から、同じ閲覧トークンで応援ライブビュー(ちくらん)へ飛べる導線。
         href は app.js が ?v= から組み立てる(token が無ければ非表示)。 -->
    <a id="liveViewLink" class="live-view-link" href="#" hidden>🪞 応援ライブビュー(そっくり)を見る →</a>

    <section class="lane" id="overviewLane">
      <h2>概要</h2>
      <pre id="overviewBody" class="empty-note">読み込み中...</pre>
    </section>

    <section class="lane" id="livesLane">
      <h2>視聴中の配信</h2>
      <div id="livesBody" class="empty-note">読み込み中...</div>
    </section>

    <footer class="status-footer">
      <div id="statusNote">
        PC の拡張から「スマホへ送信」した時点の状態を表示しています。
      </div>
    </footer>

    <script src="/app/dist/app.js"></script>
  </body>
</html>
