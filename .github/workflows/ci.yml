name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    # ★timeout を書かない job は、ハングすると【6時間のデフォルト】まで走り続ける。
    #   2026-08-06 にそれで Actions の予算を使い切り、★全リポの CI が止まった実績がある。
    #   verify(test+lint+typecheck+build) の実測は数分なので 20分あれば足りる。
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify (tests, lint, typecheck, build)
        run: npm run verify

  e2e:
    needs: test-and-build
    runs-on: ubuntu-latest
    # workers=1 + CI retries=1 で spec 数分は 20 分に届きやすい。ギリギリの打ち切りを避ける。
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for Playwright
        run: npx playwright install chromium --with-deps

      - name: Build extension bundles
        run: npm run build

      - name: Install xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Playwright E2E (headed + virtual display)
        env:
          CI: true
        run: xvfb-run -a npx playwright test
