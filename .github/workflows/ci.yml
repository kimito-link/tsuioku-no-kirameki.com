name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    # ★timeout を書かない job は、ハングすると【6時間のデフォルト】まで走り続ける。
    #   2026-08-06 にそれで Actions の予算を使い切り、★全リポの CI が止まった実績がある。
    #   verify(test+lint+typecheck+build) の実測は数分なので 20分あれば足りる。
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: dist freshness (build 忘れ / --no-verify の押し通し / マージ commit の不整合)
        run: node scripts/check-dist-fresh.mjs --ref HEAD

      - name: Verify (tests, lint, typecheck, build)
        run: npm run verify

  e2e:
    needs: test-and-build
    runs-on: ubuntu-latest
    # workers=1 + CI retries=1 で spec 数分は 20 分に届きやすい。ギリギリの打ち切りを避ける。
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for Playwright
        run: npx playwright install chromium --with-deps

      - name: Build extension bundles
        run: npm run build

      # 全拡張共通の物差し(web-ios-android/templates/extension-verify): 拡張を読み込み、
      # service worker・全画面・watch ページへの注入を確かめる。設定は extension-verify.json。
      - name: Checkout shared kit (web-ios-android)
        uses: actions/checkout@v7
        with:
          repository: kimito-link/web-ios-android
          path: .kit

      - name: Extension verify (all pages + injection)
        run: node .kit/templates/extension-verify/run.mjs .

      - name: Extension verify wiring (shared rule)
        run: node .kit/templates/diagnostics/check-extension-verify-wired.mjs .

      - name: Install xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Playwright E2E (headed + virtual display)
        env:
          CI: true
        run: xvfb-run -a npx playwright test
