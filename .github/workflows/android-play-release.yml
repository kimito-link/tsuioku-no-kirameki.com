# 追憶のきらめき ライブビュー(Android アプリ)の Google Play 用ワークフロー。
#
# 金型: web-ios-android/templates/workflows/android-play-release.yml(Capacitor 版)と、
#       同じ Capacitor 構成で配信実績のある malwarecheck.site の android-play-release.yml を mobile/ 用に写したもの。
#   - Capacitor のルートは mobile/(cap add android で mobile/android・android/ はコミットしない＝iOS の ios/ と同じ)。
#   - スクリプトは mobile/scripts/(キットからコピー)。app.config.json・release-notes も mobile/。
#   - 手動実行のみ(push では動かない)。配信先は内部テスト(internal)に固定＝製品版・審査には出さない。
#     dry_run=true なら署名つき AAB を作るまでで止め、Play には何も送らない。
#   - アイコンとスプラッシュは scripts/prepare-android-assets.mjs(手元のテスト用 APK と同じ作り方)。
#
# ── 必要な GitHub Secrets ────────────────────────────────────────
#   ANDROID_KEYSTORE_BASE64       アップロード鍵(.jks)を base64 化したもの
#   ANDROID_KEYSTORE_PROPERTIES   keystore.properties の中身そのもの(storePassword / keyPassword / keyAlias)
#   GOOGLE_PLAY_SA_JSON_BASE64    Play Developer API 用サービスアカウント JSON を base64 化したもの(dry_run では不要)
#
# - リリースノートは mobile/release-notes/CURRENT-ja.txt(500 文字以下)。
# - versionCode は「この workflow の実行番号 + app.config.json の stores.buildNumberOffset」。実行のたびに必ず増える。
name: android-play-release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "署名つき AAB を作るまでで止め、Google Play には何も送らない"
        type: boolean
        default: false

concurrency:
  group: android-play-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile
    env:
      PLAY_PACKAGE_NAME: com.kimito.link.tsuioku
      # ★内部テスト固定。製品版(production)に出すときは、この workflow を変える判断を先にする。
      PLAY_TRACK: internal
      APP_NAME: Tsuioku

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate required secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PROPERTIES: ${{ secrets.ANDROID_KEYSTORE_PROPERTIES }}
          GOOGLE_PLAY_SA_JSON_BASE64: ${{ secrets.GOOGLE_PLAY_SA_JSON_BASE64 }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          set -euo pipefail
          required=(ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PROPERTIES)
          if [ "${DRY_RUN:-false}" != "true" ]; then required+=(GOOGLE_PLAY_SA_JSON_BASE64); fi
          missing=()
          for v in "${required[@]}"; do
            if [ -z "${!v:-}" ]; then missing+=("$v"); fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing required secrets: ${missing[*]}"
            exit 1
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        # Version inferred from mobile/package.json `packageManager`(iOS の workflow と同じ)。
        with:
          package_json_file: mobile/package.json

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare webDir (Capacitor uses dist/public; server.url overrides at runtime)
        run: |
          mkdir -p dist/public
          if [ ! -f dist/public/index.html ]; then
            echo "<!doctype html><html><head><meta charset=\"utf-8\"><title>${APP_NAME}</title></head><body>loading...</body></html>" > dist/public/index.html
          fi

      - name: Verify webDir consistency (capacitor.config.ts vs Prepare webDir)
        run: node scripts/verify-webdir-consistency.mjs --expected dist/public

      - name: Add/sync Android platform
        run: |
          set -euo pipefail
          if [ ! -d android/app ]; then
            npx cap add android
          fi
          # ★cap copy でなく cap sync。copy は新しいプラグインを android プロジェクトに登録しない(キットの地雷)。
          npx cap sync android

      - name: Generate app icon + splash, verify not shipping Capacitor defaults
        run: |
          set -euo pipefail
          node scripts/verify-android-splash-not-default.mjs --snapshot
          node scripts/prepare-android-assets.mjs
          node scripts/verify-android-splash-not-default.mjs --verify

      - name: Set Android versionName / versionCode
        run: |
          set -euo pipefail
          GRADLE="android/app/build.gradle"
          test -f "$GRADLE"
          MARK_VER="$(node -p "require('./app.config.json').stores.marketingVersion")"
          OFFSET="$(node -p "Number(require('./app.config.json').stores.buildNumberOffset || 0)")"
          BN="$(( ${GITHUB_RUN_NUMBER:-1} + OFFSET ))"
          sed -i -E "s/versionCode[[:space:]]+[0-9]+/versionCode ${BN}/" "$GRADLE"
          sed -i -E "s/versionName[[:space:]]+\"[^\"]*\"/versionName \"${MARK_VER}\"/" "$GRADLE"
          echo "versionName=$MARK_VER versionCode=$BN"
          grep -E "versionCode|versionName" "$GRADLE"

      - name: Restore signing material
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PROPERTIES: ${{ secrets.ANDROID_KEYSTORE_PROPERTIES }}
        run: |
          set -euo pipefail
          # 鍵と properties は android/ 直下に置く。android-patch-signing.mjs が注入する storeFile は
          # app/build.gradle から見た ../android-upload-key.jks、properties は rootProject.file("keystore.properties")。
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/android-upload-key.jks
          printf '%s\n' "$ANDROID_KEYSTORE_PROPERTIES" > android/keystore.properties
          ls -l android/android-upload-key.jks android/keystore.properties

      - name: Verify signing material path (before patching)
        run: node scripts/verify-signing-material-path.mjs --gradle android/app/build.gradle --keystore ../android-upload-key.jks

      - name: Inject signingConfig into build.gradle
        run: node scripts/android-patch-signing.mjs --gradle android/app/build.gradle --keystore ../android-upload-key.jks

      - name: Verify signingConfig (block unsigned AAB)
        run: node scripts/verify-android-signing-config.mjs --gradle android/app/build.gradle

      - name: Build release AAB
        working-directory: mobile/android
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon bundleRelease
          ls -l app/build/outputs/bundle/release/

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v7
        with:
          name: android-aab
          path: mobile/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Restore Service Account JSON
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          GOOGLE_PLAY_SA_JSON_BASE64: ${{ secrets.GOOGLE_PLAY_SA_JSON_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p .secrets
          printf '%s' "$GOOGLE_PLAY_SA_JSON_BASE64" | base64 -d > .secrets/google-play-sa.json
          node -e "JSON.parse(require('fs').readFileSync('.secrets/google-play-sa.json','utf8')); console.log('SA JSON parsed OK')"

      - name: Publish to Google Play (internal track)
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          GOOGLE_PLAY_SA_JSON_PATH: .secrets/google-play-sa.json
          PLAY_AAB_PATH: android/app/build/outputs/bundle/release/app-release.aab
        run: node scripts/play-publish.mjs

      - name: Dry-run summary
        if: ${{ github.event.inputs.dry_run == 'true' }}
        run: |
          echo "::notice::dry_run=true のため Google Play には何も送っていません。署名つき AAB は android-aab アーティファクトにあります。"

      - name: Cleanup secrets
        if: always()
        run: |
          rm -f .secrets/google-play-sa.json
          rm -f android/android-upload-key.jks
          rm -f android/keystore.properties
